services:
  # MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: wastevalue-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-Preet@2279}
      MYSQL_DATABASE: ${DB_NAME:-wastevalue}
    ports:
      - "${DB_PORT:-3308}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - wastevalue-net

  # Express Node.js Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wastevalue-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-Preet@2279}
      DB_NAME: ${DB_NAME:-wastevalue}
      JWT_SECRET: ${JWT_SECRET:-wastevalue_secret_2026}
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - wastevalue-net

  # React Frontend Served Through Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wastevalue-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - wastevalue-net

volumes:
  mysql_data:
    driver: local

networks:
  wastevalue-net:
    driver: bridge